<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Barmeto Link Opener — offline</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0a0a0a; color: #a3a3a3;
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    main { text-align: center; max-width: 380px; padding: 24px; }
    h1 { color: #fff; font-size: 18px; margin: 0 0 8px; }
    button {
      margin-top: 20px; height: 36px; padding: 0 20px; border: 0; border-radius: 8px;
      background: #6e02d9; color: #fff; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #9333ea; }
  </style>
</head>
<body>
  <main>
    <h1>Can't reach Link Opener</h1>
    <p>Check your internet connection, then try again. Your saved links are safe.</p>
    <button id="retry" type="button">Retry</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', () => window.desktop?.retry())
  </script>
</body>
</html>
